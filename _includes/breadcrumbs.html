{%- comment -%} Home > [parent] > current page. Skipped on the home page. {%- endcomment -%}
{%- if page.url != '/' and page.url != '/404.html' %}
<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ '/' | relative_url }}">Home</a></li>
    {%- if page.parent_url %}
    <li><a href="{{ page.parent_url | relative_url }}">{{ page.parent_title }}</a></li>
    {%- endif %}
    <li><span aria-current="page">{{ page.title }}</span></li>
  </ol>
</nav>
{%- endif %}
